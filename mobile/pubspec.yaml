name: telegram_chat_mobile
description: "Telegram Connected Chat Mobile Application"
publish_to: 'none'
version: 1.0.7+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.3

  http: ^1.2.2
  http_parser: ^4.1.2
  web_socket_channel: ^3.0.1
  url_launcher: ^6.3.0
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.0

  open_filex: ^4.5.0
  package_info_plus: ^8.1.0

  record: ^5.2.0
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5

  shared_preferences: ^2.3.2
  device_info_plus: ^10.1.2
  uuid: ^4.5.1
  intl: ^0.20.3
  emoji_picker_flutter: ^4.5.4

  flutter_local_notifications: 17.2.3
  sqflite: ^2.4.4
  path: ^1.9.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dependency_overrides:
  record_platform_interface: 1.2.0
  record_linux: 0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000966"
  adaptive_icon_foreground: "assets/app_icon.png"
  notification_icon:
    android: true
    image_path: "assets/app_icon.png"