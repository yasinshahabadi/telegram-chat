name = "telegram-chat-app"
main = "src/index.js"
compatibility_date = "2024-04-01"

[[d1_databases]]
binding = "DB"
database_name = "chat-db"
database_id = "6b53e474-18eb-4be4-87cf-6fda96db3cf1"

# باکت ذخیره‌سازی ابری چندرسانه‌ای R2 (محیط پروداکشن)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "chat-media"

[durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# حذف خودکار پیام‌ها بعد ۲۴ ساعت (هر ساعت چک میکند)
[triggers]
crons = ["0 * * * *"]

[vars]
TELEGRAM_GROUP_ID = "-5585398377"
ADMIN_TELEGRAM_ID = "122623127"

# --- محیط آزمایشی کاملاً مستقل (Staging) ---
[env.staging]
name = "telegram-chat-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "chat-db-staging"
database_id = "1ecf41a0-8348-439c-b062-10b3cce3e99f"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "chat-media-staging"

[env.staging.durable_objects]
bindings = [
  { name = "CHAT_ROOM", class_name = "ChatRoom" }
]

[env.staging.vars]
TELEGRAM_GROUP_ID = "-5585398377"
ADMIN_TELEGRAM_ID = "122623127"
